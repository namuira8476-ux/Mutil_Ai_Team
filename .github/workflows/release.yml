name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run check:privacy
      - name: Verify installer checksum handling
        shell: pwsh
        run: ./scripts/test-installer.ps1
      - run: npm run build
      - name: Verify enterprise Gemini team delegation with fixture CLIs
        run: node scripts/verify-enterprise-team.mjs
      - run: npx electron-builder --win nsis --x64 --publish never
      - run: npm run check:privacy -- --package
      - name: Publish verified installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne $tag) { throw 'Tag/package version mismatch' }
          $file = "release/AgentStudio-$version-win-x64-setup.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $file -Leaf)" | Set-Content release/SHA256SUMS.txt -Encoding ascii
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title "Agent Studio $version" --notes-file docs/RELEASE.md --target '${{ github.sha }}' }
          gh release upload $tag $file release/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
